name: websocket_ai_analytics
description: A professional Flutter mobile app with WebSocket real-time data, AI/ML analytics, and predictive forecasting.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # WebSocket
  web_socket_channel: ^2.4.0

  # Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # Charts
  fl_chart: ^0.66.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

  # PDF & CSV Export
  pdf: ^3.10.8
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
